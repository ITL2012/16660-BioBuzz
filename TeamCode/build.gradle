apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlinx-serialization'

//
// build.gradle in TeamCode
//
// Most of the definitions for building your module reside in a common, shared
// file 'build.common.gradle'. Being factored in this way makes it easier to
// integrate updates to the FTC into your code. If you really need to customize
// the build definitions, you can place those customizations in this file, but
// please think carefully as to whether such customizations are really necessary
// before doing so.

// Custom definitions may go here

// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    kotlinOptions{
        jvmTarget = '1.8'
    }

    packagingOptions {
        jniLibs.useLegacyPackaging true
    }

    testOptions {
        // The JVM unit tests run against android.jar's STUB classes, where
        // every method throws "not mocked". The SQLite JDBC driver logs
        // through SLF4J, which routes to android.util.Log — so without this
        // every DB call dies on Log.isLoggable before it reaches SQLite.
        unitTests.returnDefaultValues = true
    }
}
repositories {
    maven {
        url 'https://repo.dairy.foundation/releases'
    }
    maven {
        url 'https://maven.brott.dev/'
    }
}

dependencies {
    implementation project(':FtcRobotController')
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    //testing out a control library
    implementation 'dev.nextftc.v2:control:0.2.0'
    implementation 'dev.nextftc.v2:hardware:0.2.0'
    implementation 'dev.nextftc.v2:robot:0.2.0'

    // on-robot neural net inference (ball detector); the shot predictor is
    // pure Kotlin and needs no library
    implementation 'org.tensorflow:tensorflow-lite:2.14.0'

    //testing out a pathfinding library
    implementation "com.acmerobotics.roadrunner:ftc:0.1.25"
    implementation "com.acmerobotics.roadrunner:core:1.0.1"
    implementation "com.acmerobotics.roadrunner:actions:1.0.1"
    implementation "com.acmerobotics.dashboard:dashboard:0.5.1"

    // BlackBox Binary: async Protobuf writer
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-protobuf:1.6.3"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0"

    // Recommended external libraries:
    // - EJML: Efficient Java Matrix Library for EKF sensor fusion
    implementation "org.ejml:ejml-simple:0.41"
    // - Apache Commons Math: for RRT* math utilities, optimization
    implementation "org.apache.commons:commons-math3:3.6.1"
    // - Typesafe Config (HOCON): versioned, type-safe configuration
    implementation "com.typesafe:config:1.4.3"
    // - OjAlgo: linear algebra + QP solver for LQR/MPC
    implementation "org.ojalgo:ojalgo:53.0.0"
    // - Protobuf Java (for custom binary serialization if needed)
    implementation "com.google.protobuf:protobuf-java:3.25.2"

    // JVM unit tests for the pure autonomy math (WorldModel, PhaseClock, DeadWheelMath)
    testImplementation 'junit:junit:4.13.2'
}


dependencies {
    // SQLite JDBC for the desktop side of the Black Box. The Robot
    // Controller writes the very same .db files with Android's own SQLite,
    // so a session recorded on the robot opens unchanged on a computer —
    // and Python's stdlib sqlite3 can read it with no extra dependency.
    testImplementation "org.xerial:sqlite-jdbc:3.54.1.0"
}
