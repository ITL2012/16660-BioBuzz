name: BioBuzz Autonomy Regression Tests

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'

jobs:
  jvm-tests:
    name: JVM Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run JVM Tests
        run: ./gradlew :TeamCode:test --info
        working-directory: .
      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-test-report
          path: TeamCode/build/reports/tests/
          retention-days: 7

  simulation-regression:
    name: Simulation Regression (BlackBox Replay)
    runs-on: ubuntu-latest
    needs: jvm-tests
    if: ${{ github.event_name != 'schedule' || github.repository == 'your-org/16660-BioBuzz' }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Generate BlackBox Test Fixtures
        run: python3 ci_scripts/generate_fixtures.py
      - name: Run Simulation Harness
        run: ./gradlew :TeamCode:test --tests "org.firstinspires.ftc.teamcode.SimulationHarnessTest" --info
        working-directory: .
      - name: Run MCTS Determinism Test
        run: ./gradlew :TeamCode:test --tests "org.firstinspires.ftc.teamcode.MCTSPlannerTest" --info
        working-directory: .
      - name: Run PhaseClock Budget Test
        run: ./gradlew :TeamCode:test --tests "org.firstinspires.ftc.teamcode.PhaseClockTest" --info
        working-directory: .
      - name: Run the Python tools against a recorded session
        run: |
          python3 ci_scripts/check_tools.py
        working-directory: .
      - name: Upload Simulation Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-results
          path: |
            TeamCode/build/reports/tests/
            blackbox_fixtures/
          retention-days: 14

  golden-master-check:
    name: Golden Master Validation
    runs-on: ubuntu-latest
    needs: simulation-regression
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for Golden Master Changes
        run: |
          if [ -d "golden" ]; then
            echo "Checking golden master changes..."
            git diff --name-only HEAD~1 -- golden/ || true
            if git diff --quiet HEAD~1 -- golden/; then
              echo "No golden master changes"
            else
              echo "::warning::Golden master files changed - review required"
              git diff HEAD~1 -- golden/
            fi
          else
            echo "No golden masters directory yet"
          fi

  static-analysis:
    name: Static Analysis (Detekt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
      - name: Run Detekt
        run: ./gradlew :TeamCode:detekt || true
        working-directory: .
        continue-on-error: true
      - name: Upload Detekt Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-report
          path: TeamCode/build/reports/detekt/
          retention-days: 7

  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [jvm-tests, simulation-regression, golden-master-check, static-analysis]
    if: failure()
    steps:
      - name: Send Failure Notification
        run: |
          echo "Build failed! Check GitHub Actions for details."
          # Add Slack/Discord webhook here if desired
          # curl -X POST -H 'Content-type: application/json' --data '{"text":"BioBuzz build failed"}' $WEBHOOK_URL